services:
  cars-minio:
    build:
      context: .
      dockerfile: docker/minio.Dockerfile
      target: minio
    image: cars-minio:lab1
    restart: unless-stopped
    hostname: cars-minio
    networks:
      default:
        aliases:
          - cars-minio
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-rootpassword}
    volumes:
      - cars-media:/data
    command: server /data --console-address ":9001"
  cars-media-init:
    profiles: ["media"]
    build:
      context: .
      dockerfile: docker/minio.Dockerfile
      target: media-init
    image: cars-mc:lab1
    depends_on:
      - cars-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-rootpassword}
    volumes:
      - ./media:/cars-media:ro
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        cars_attempt=0
        until mc alias set cars http://cars-minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          cars_attempt=$$((cars_attempt + 1))
          [ "$$cars_attempt" -lt 30 ] || exit 1
          sleep 2
        done
        mc mb --ignore-existing cars/cars
        mc anonymous set download cars/cars
        mc cp /cars-media/*.jpg /cars-media/*.mp4 cars/cars/
volumes:
  cars-media:
