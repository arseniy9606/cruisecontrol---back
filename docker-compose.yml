name: cars-lab2
x-fuel-environment: &fuel-environment
  CARS_DATABASE_URL: postgres://${CARS_DB_USER:-cars_student}:${CARS_DB_PASSWORD:-cars_lab2_password}@cars-postgres:5432/${CARS_DB_NAME:-cars_lab2}?sslmode=disable
  CARS_LISTEN: 0.0.0.0:8082
  CARS_MEDIA_URL: http://localhost:9100/cars
  CARS_MEDIA_PROBE_URL: http://cars-minio:9000/cars
services:
  cars-postgres:
    image: postgres:16.10-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CARS_DB_USER:-cars_student}
      POSTGRES_PASSWORD: ${CARS_DB_PASSWORD:-cars_lab2_password}
      POSTGRES_DB: ${CARS_DB_NAME:-cars_lab2}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["cars-postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 30
  cars-adminer:
    image: adminer:5.4.1
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: cars-postgres
    ports: ["127.0.0.1:8083:8080"]
    depends_on:
      cars-postgres: {condition: service_healthy}
  cars-minio:
    hostname: cars-minio
    networks:
      default:
        aliases: [cars-minio]
    build:
      context: .
      dockerfile: docker/minio.Dockerfile
      target: minio
    image: cars-minio:lab1
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cars_root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cars_media_password}
    command: server /data --console-address ":9001"
    ports: ["127.0.0.1:9100:9000", "127.0.0.1:9101:9001"]
    volumes: ["cars-minio-data:/data"]
  cars-media-init:
    build:
      context: .
      dockerfile: docker/minio.Dockerfile
      target: media-init
    image: cars-mc:lab1
    depends_on: [cars-minio]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cars_root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cars_media_password}
    volumes: ["./media:/cars-media:ro"]
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        cars_attempt=0
        until mc alias set cars http://cars-minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          cars_attempt=$$((cars_attempt + 1))
          [ "$$cars_attempt" -lt 30 ] || exit 1
          sleep 2
        done
        mc mb --ignore-existing cars/cars
        mc anonymous set download cars/cars
        mc cp /cars-media/*.jpg /cars-media/*.mp4 cars/cars/
  cars-migrate:
    build:
      context: .
      dockerfile: docker/cars.Dockerfile
    image: cars-backend:lab2
    environment: *fuel-environment
    command: ["cars-migrate", "-seed"]
    depends_on:
      cars-postgres: {condition: service_healthy}
  cars-backend:
    build:
      context: .
      dockerfile: docker/cars.Dockerfile
    image: cars-backend:lab2
    restart: unless-stopped
    environment: *fuel-environment
    ports: ["127.0.0.1:8082:8082"]
    depends_on:
      cars-migrate: {condition: service_completed_successfully}
      cars-media-init: {condition: service_completed_successfully}
  cars-checks:
    profiles: [checks]
    build:
      context: .
      dockerfile: docker/cars.Dockerfile
      target: build
    environment:
      CARS_TEST_DATABASE_URL: postgres://${CARS_DB_USER:-cars_student}:${CARS_DB_PASSWORD:-cars_lab2_password}@cars-postgres:5432/${CARS_DB_NAME:-cars_lab2}?sslmode=disable
    command: ["sh", "-ec", "go test -v ./... && go vet ./..."]
    depends_on:
      cars-postgres: {condition: service_healthy}
volumes:
  cars-postgres-data:
  cars-minio-data:
