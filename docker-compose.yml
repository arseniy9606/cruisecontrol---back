name: cruisecontrol-lab3
x-env: &env
  DATABASE_URL: postgres://student:lab3_password@postgres:5432/fuel_consumptions?sslmode=disable
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: lab3_root
  MINIO_SECRET_KEY: lab3_media_password
  MEDIA_PUBLIC_URL: http://localhost:9200/cars
services:
  postgres:
    image: postgres:16.10-bookworm
    environment:
      POSTGRES_USER: student
      POSTGRES_PASSWORD: lab3_password
      POSTGRES_DB: fuel_consumptions
    ports: ["127.0.0.1:55433:5432"]
    volumes: ["postgres-catalog-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d fuel_consumptions"]
      interval: 2s
      timeout: 3s
      retries: 30
  minio:
    image: fuel_consumptions-minio:lab1
    build:
      context: .
      dockerfile: docker/minio.Dockerfile
      target: minio
    environment:
      MINIO_ROOT_USER: lab3_root
      MINIO_ROOT_PASSWORD: lab3_media_password
    command: server /data --console-address ":9001"
    ports: ["127.0.0.1:9200:9000", "127.0.0.1:9201:9001"]
    volumes: ["media-data:/data"]
  media-init:
    image: fuel_consumptions-mc:lab1
    build:
      context: .
      dockerfile: docker/minio.Dockerfile
      target: media-init
    depends_on: [minio]
    volumes: ["./media:/media:ro"]
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        until mc alias set lab3 http://minio:9000 lab3_root lab3_media_password; do sleep 1; done
        mc mb --ignore-existing lab3/cars
        mc anonymous set download lab3/cars
        mc cp /media/*.jpg /media/*.mp4 lab3/cars/
  migrate:
    image: cruisecontrol:lab3
    build:
      context: .
      dockerfile: docker/cars.Dockerfile
    environment: *env
    command: ["migrate"]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    image: cruisecontrol:lab3
    build:
      context: .
      dockerfile: docker/cars.Dockerfile
    environment: *env
    ports: ["127.0.0.1:8085:8080"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      media-init: {condition: service_completed_successfully}
volumes:
  postgres-catalog-data:
  media-data:
