<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720"><rect width="1400" height="720" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#21201f}.head{font-size:20px;font-weight:bold}.field{font-size:16px}.small{font-size:15px}</style><text x="32" y="30" class="head">Расход топлива автомобилей — схема PostgreSQL</text><rect x="30" y="65" width="590" height="156" rx="4" fill="white" stroke="#444" stroke-width="2"/><rect x="31" y="66" width="588" height="40" fill="#f3f3f3"/><text x="325.0" y="92" class="head" text-anchor="middle">fuel_consumption_drivers</text><text x="40" y="129" class="field">PK</text><text x="85" y="129" class="field">fuel_consumption_driver_id</text><text x="455" y="129" class="field">BIGINT</text><text x="40" y="157" class="field">U</text><text x="85" y="157" class="field">fuel_consumption_driver_login</text><text x="455" y="157" class="field">VARCHAR(60)</text><text x="40" y="185" class="field"></text><text x="85" y="185" class="field">fuel_consumption_driver_name</text><text x="455" y="185" class="field">VARCHAR(120)</text><text x="40" y="213" class="field"></text><text x="85" y="213" class="field">fuel_consumption_driver_created_at</text><text x="455" y="213" class="field">TIMESTAMPTZ</text><rect x="780" y="65" width="590" height="352" rx="4" fill="white" stroke="#444" stroke-width="2"/><rect x="781" y="66" width="588" height="40" fill="#f3f3f3"/><text x="1075.0" y="92" class="head" text-anchor="middle">fuel_consumptions</text><text x="790" y="129" class="field">PK</text><text x="835" y="129" class="field">fuel_consumption_id</text><text x="1205" y="129" class="field">BIGINT</text><text x="790" y="157" class="field"></text><text x="835" y="157" class="field">fuel_consumption_name</text><text x="1205" y="157" class="field">VARCHAR(120)</text><text x="790" y="185" class="field"></text><text x="835" y="185" class="field">fuel_consumption_description</text><text x="1205" y="185" class="field">VARCHAR(1000)</text><text x="790" y="213" class="field"></text><text x="835" y="213" class="field">fuel_consumption_status</text><text x="1205" y="213" class="field">VARCHAR(20)</text><text x="790" y="241" class="field"></text><text x="835" y="241" class="field">fuel_consumption_image_url</text><text x="1205" y="241" class="field">VARCHAR(500)</text><text x="790" y="269" class="field"></text><text x="835" y="269" class="field">fuel_consumption_video_url</text><text x="1205" y="269" class="field">VARCHAR(500)</text><text x="790" y="297" class="field"></text><text x="835" y="297" class="field">fuel_tank_volume</text><text x="1205" y="297" class="field">NUMERIC(7,1)</text><text x="790" y="325" class="field"></text><text x="835" y="325" class="field">fuel_consumption_rate</text><text x="1205" y="325" class="field">NUMERIC(4,1)</text><text x="790" y="353" class="field"></text><text x="835" y="353" class="field">fuel_consumption_created_at</text><text x="1205" y="353" class="field">TIMESTAMPTZ</text><text x="790" y="381" class="field">FK</text><text x="835" y="381" class="field">fuel_consumption_creator_id</text><text x="1205" y="381" class="field">BIGINT</text><text x="790" y="409" class="field">N</text><text x="835" y="409" class="field">fuel_consumption_formed_at</text><text x="1205" y="409" class="field">TIMESTAMPTZ</text><rect x="300" y="510" width="590" height="128" rx="4" fill="white" stroke="#444" stroke-width="2"/><rect x="301" y="511" width="588" height="40" fill="#f3f3f3"/><text x="595.0" y="537" class="head" text-anchor="middle">fuel_consumption_likes</text><text x="310" y="574" class="field">PK</text><text x="355" y="574" class="field">fuel_consumption_like_id</text><text x="725" y="574" class="field">BIGINT</text><text x="310" y="602" class="field">FK</text><text x="355" y="602" class="field">fuel_consumption_id</text><text x="725" y="602" class="field">BIGINT</text><text x="310" y="630" class="field">FK</text><text x="355" y="630" class="field">fuel_consumption_driver_id</text><text x="725" y="630" class="field">BIGINT</text><path d="M620 140 H780" fill="none" stroke="#444" stroke-width="2"/><text x="640" y="125" class="small">1 → 0..*</text><path d="M325 222 V410 H470 V510" fill="none" stroke="#444" stroke-width="2"/><text x="335" y="390" class="small">1 → 0..*</text><path d="M1060 417 V570 H890" fill="none" stroke="#444" stroke-width="2"/><text x="1080" y="505" class="small">1 → 0..*</text><text x="32" y="676" class="small">PK — первичный ключ · FK — внешний ключ · N — NULL допустим · U — уникальное значение</text><text x="32" y="702" class="small">Лайки реализуют M:N. Все FK: ON DELETE RESTRICT. Не более одного черновика на водителя.</text></svg>