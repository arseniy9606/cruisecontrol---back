<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Добавление автомобиля</title><link rel="stylesheet" href="/fuel_consumptions-assets/styles/fuel_consumptions.css"></head><body><div class="fuel_consumptions-shell"><main class="fuel_consumptions-content fuel_consumptions-draft">
<div class="fuel_consumptions-eyebrow">НОВАЯ КАРТОЧКА</div><h1>Добавить<br>автомобиль</h1>
{{if .FuelConsumptionError}}<p class="fuel_consumptions-error">{{.FuelConsumptionError}}</p>{{else}}{{with .FuelConsumptionCard}}
<p class="fuel_consumptions-draft-note">{{.FuelConsumptionStatus}} · без сохранения</p>
<div class="fuel_consumptions-upload"><label for="fuel_consumptions-image">Фото автомобиля</label><img src="{{.FuelConsumptionImageURL}}" alt="Фото черновика {{.FuelConsumptionName}}"><input id="fuel_consumptions-image" type="file" accept="image/*" aria-label="Выбрать фото автомобиля"></div>
<div class="fuel_consumptions-upload"><label for="fuel_consumptions-video">Видео автомобиля</label><video controls muted playsinline preload="metadata" poster="{{.FuelConsumptionImageURL}}"><source src="{{.FuelConsumptionVideoURL}}" type="video/mp4"></video><input id="fuel_consumptions-video" type="file" accept="video/*" aria-label="Выбрать видео автомобиля"></div>
<div class="fuel_consumptions-draft-fields"><label for="fuel_consumptions-name">Название автомобиля</label><input id="fuel_consumptions-name" type="text" value="{{.FuelConsumptionName}}" maxlength="120"><label for="fuel_consumptions-description-field">Описание</label><textarea id="fuel_consumptions-description-field" rows="3" maxlength="1000">{{.FuelConsumptionDescription}}</textarea><label for="fuel_consumptions-tank-volume">Объём бака, л</label><input id="fuel_consumptions-tank-volume" name="fuel_consumptions_tank_volume" type="number" min="1" max="1500" step="0.1" value="{{.FuelTankVolume}}"><label for="fuel_consumptions-consumption">Расход топлива, л/100 км</label><input id="fuel_consumptions-consumption" name="fuel_consumptions_rate" type="number" min="0" max="60" step="0.1" value="{{.FuelConsumptionRate}}"></div>
<button class="fuel_consumptions-primary fuel_consumptions-draft-next" type="button" disabled>Далее</button><p class="fuel_consumptions-draft-hint">Заполнять поля можно. Сохранение появится на следующем этапе.</p>
{{end}}{{end}}</main><nav class="fuel_consumptions-nav" aria-label="Разделы автомобилей"><a href="/fuel_consumptions/feed/"><svg class="fuel_consumptions-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="4"/><path d="m10 8 6 4-6 4Z"/></svg><span>Лента</span></a><a aria-current="page" href="/fuel_consumptions/draft"><svg class="fuel_consumptions-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16M4 12h16"/></svg><span>Добавление</span></a><a href="/fuel_consumptions"><svg class="fuel_consumptions-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>Плитка</span></a></nav></div></body></html>
