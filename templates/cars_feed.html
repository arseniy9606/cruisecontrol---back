<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Лента автомобилей</title><link rel="stylesheet" href="/cars-assets/styles/cars.css"></head><body><div class="cars-shell cars-feed-shell"><main class="cars-feed">
{{if .CarError}}<div class="cars-empty"><h1>{{.CarError}}</h1><a href="/cars">К автомобилям</a></div>{{else}}{{with .CarCard}}
 <img class="cars-feed-poster" src="{{.CarImageURL}}" alt="{{.CarName}}">
 <video class="cars-feed-video" autoplay muted loop playsinline preload="auto" poster="{{.CarImageURL}}" aria-label="Видео {{.CarName}}"><source src="{{.CarVideoURL}}" type="video/mp4"></video>
 <div class="cars-feed-shade"></div>
 <aside class="cars-feed-facts" aria-label="Параметры автомобиля"><div><svg class="cars-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14v16H5zM8 4V2h8v2M8 9h8M9 16h6"/></svg><strong>{{carsFuel .FuelTankVolume}}</strong><small>объём бака, л</small></div><div><svg class="cars-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V4h9v17M2 21h13M4 10h9m0 3h3v5a2 2 0 0 0 4 0V8l-3-3M18 7l2 2"/></svg><strong>{{carsFuel .CarRate}}</strong><small>л/100 км</small></div><div aria-label="{{.CarLikeCount}} лайков"><svg class="cars-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></svg><strong>{{.CarLikeCount}}</strong></div><a class="cars-next" href="/cars/feed/{{.CarID}}?next=true" aria-label="Следующий автомобиль" title="Следующий автомобиль"><svg class="cars-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m8 5 8 7-8 7M19 5v14"/></svg></a></aside>
 <section class="cars-feed-caption"><h1>{{.CarName}}</h1><input class="cars-description-toggle" type="checkbox" id="cars-description-expanded"><p id="cars-description">{{.CarDescription}}</p><label class="cars-description-label" for="cars-description-expanded"><span class="cars-more">Ещё</span><span class="cars-less">Меньше</span></label></section>
{{end}}{{end}}</main><nav class="cars-nav" aria-label="Разделы автомобилей"><a aria-current="page" href="/cars/feed/"><svg class="cars-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="4"/><path d="m10 8 6 4-6 4Z"/></svg><span>Лента</span></a><a href="/cars/draft"><svg class="cars-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16M4 12h16"/></svg><span>Добавление</span></a><a href="/cars"><svg class="cars-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>Плитка</span></a></nav></div></body></html>
