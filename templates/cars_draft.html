<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Добавление автомобиля</title><link rel="stylesheet" href="/cars-assets/styles/cars.css"></head><body><div class="cars-shell"><main class="cars-content cars-draft">
<div class="cars-eyebrow">НОВАЯ КАРТОЧКА</div><h1>Добавить<br>автомобиль</h1>
{{if .CarError}}<p class="cars-error">{{.CarError}}</p>{{else}}{{with .CarCard}}
<p class="cars-draft-note">{{.CarStatus}} · без сохранения</p>
<div class="cars-upload"><label for="cars-image">Фото автомобиля</label><img src="{{.CarImageURL}}" alt="Фото черновика {{.CarName}}"><input id="cars-image" type="file" accept="image/*" aria-label="Выбрать фото автомобиля"></div>
<div class="cars-upload"><label for="cars-video">Видео автомобиля</label><video controls muted playsinline preload="metadata" poster="{{.CarImageURL}}"><source src="{{.CarVideoURL}}" type="video/mp4"></video><input id="cars-video" type="file" accept="video/*" aria-label="Выбрать видео автомобиля"></div>
<div class="cars-draft-fields"><label for="cars-name">Название автомобиля</label><input id="cars-name" type="text" value="{{.CarName}}" maxlength="120"></div>
<p class="cars-draft-hint">Заполнять поля можно. Сохранение появится на следующем этапе.</p>
{{end}}{{end}}</main><nav class="cars-nav" aria-label="Разделы автомобилей"><a href="/cars/feed/"><svg class="cars-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="4"/><path d="m10 8 6 4-6 4Z"/></svg><span>Лента</span></a><a aria-current="page" href="/cars/draft"><svg class="cars-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16M4 12h16"/></svg><span>Добавление</span></a><a href="/cars"><svg class="cars-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>Плитка</span></a></nav></div></body></html>
